[package]
name = "vatsim-live-transcriber"
version = "0.1.0"
edition = "2024"
description = "Native Windows VATSIM live transcription client"
license = "MIT"

[lib]
name = "vatsim_live_transcriber"
path = "src/lib.rs"

[[bin]]
name = "vatsim-live-transcriber"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
